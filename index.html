<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI QR Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f14;
      --surface: #16181f;
      --surface2: #1e2029;
      --border: rgba(255,255,255,0.07);
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --text: #f0f1f5;
      --muted: #6b7080;
      --error: #f87171;
      --success: #34d399;
      --radius: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 50% at 10% 0%, rgba(79,142,247,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%, rgba(167,139,250,0.10) 0%, transparent 60%);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      margin-bottom: 32px;
    }

    .header-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-tag::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: var(--muted); }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
    }

    input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(248,113,113,0.12);
    }

    .field-hint {
      font-size: 12px;
      color: var(--error);
      min-height: 16px;
      transition: opacity 0.2s;
      display: none;
    }

    .field-hint.visible { display: block; }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #3b7de8);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 20px rgba(79,142,247,0.35);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(79,142,247,0.45);
      filter: brightness(1.05);
    }

    button:active { transform: translateY(0); }

    /* QR Output */
    #qrSection {
      display: none;
      margin-top: 28px;
      animation: fadeUp 0.4s ease both;
    }

    #qrSection.visible { display: block; }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 24px;
    }

    .qr-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    .qr-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrCode canvas {
      border-radius: 12px;
      display: block;
      box-shadow: 0 0 0 10px white, 0 8px 32px rgba(0,0,0,0.4);
    }

    .qr-meta {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .qr-meta strong {
      color: var(--text);
      display: block;
      font-size: 15px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="header-tag">Instant Payments</div>
      <h1>UPI <span>QR</span> Generator</h1>
    </div>

    <div class="fields">
      <div class="field">
        <label for="upiID">UPI ID</label>
        <div class="input-wrap">
          <input type="text" id="upiID" placeholder="yourname@bank" autocomplete="off">
        </div>
        <span class="field-hint" id="upiError">Invalid UPI ID — must follow format name@bank</span>
      </div>

      <div class="field">
        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" min="1">
        <span class="field-hint" id="amountError">Please enter a valid amount</span>
      </div>

      <div class="field">
        <label for="note">Note <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
        <input type="text" id="note" placeholder="e.g. Lunch, Rent...">
      </div>
    </div>

    <button id="generateQR">Generate QR Code</button>

    <div id="qrSection">
      <div class="divider"></div>
      <div class="qr-label">Scan to pay</div>
      <div class="qr-wrapper">
        <div id="qrCode"></div>
      </div>
      <div class="qr-meta">
        <strong id="qrUpiLabel"></strong>
        <span id="qrAmountLabel"></span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
